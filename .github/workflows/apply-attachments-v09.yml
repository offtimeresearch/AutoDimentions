name: Apply Attachments V0.9

on:
  push:
    paths:
      - 'tools/apply_attachments_v09.py'
      - '.github/workflows/apply-attachments-v09.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply attachment-aware patch
        run: python3 tools/apply_attachments_v09.py

      - name: Validate iLogic source
        run: python3 tools/validate_ilogic.py TopologyExtractor.vb

      - name: Commit patched source
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TopologyExtractor.vb
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "Add attachment-aware extraction and schematic V0.9"
          git push origin HEAD:main
