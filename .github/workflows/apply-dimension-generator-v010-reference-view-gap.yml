name: Apply DimensionGenerator V0.10 Reference View Gap

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/patch_dimension_generator_v010_reference_view_gap.py'
      - '.github/workflows/apply-dimension-generator-v010-reference-view-gap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch DimensionGenerator
        run: python tools/patch_dimension_generator_v010_reference_view_gap.py

      - name: Validate DimensionGenerator
        run: python tools/validate_ilogic.py DimensionGenerator.vb

      - name: V0.10 safety assertions
        run: |
          grep -q 'DimensionGenerator V0.10' DimensionGenerator.vb
          grep -q 'Tolerance.SetToReference' DimensionGenerator.vb
          grep -q 'VIEW_PICKER chosen' DimensionGenerator.vb
          grep -q 'bottomY - 1.00' DimensionGenerator.vb
          grep -q 'rightX + 1.00' DimensionGenerator.vb
          python - <<'PY'
          from pathlib import Path
          t = Path('DimensionGenerator.vb').read_text(encoding='utf-8')
          assert 'Text.FormattedText = "("' not in t, 'old fake reference text formatting still active'
          s = t.index('Function EnsureSafeSpoolCenterlinesV08')
          e = t.index('Function ResolveProjectedAnchorsV03', s)
          assert 'AddBisector' not in t[s:e], 'safe integrated centerline block regressed to AddBisector'
          assert 'sheet.Centerlines.Add(points)' in t[s:e], 'proven regular centerline creation missing'
          print('V0.10 safety assertions passed.')
          PY

      - name: Commit V0.10 generator
        run: |
          if git diff --quiet -- DimensionGenerator.vb; then
            echo 'DimensionGenerator.vb already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DimensionGenerator.vb
          git commit -m 'Use true reference dims view picker and larger spacing V0.10'
          git push
