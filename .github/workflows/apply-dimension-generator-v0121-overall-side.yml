name: Apply DimensionGenerator V0.12.1 Overall Side

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/apply_dimension_generator_v0121_overall_side.py'
      - '.github/workflows/apply-dimension-generator-v0121-overall-side.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch DimensionGenerator
        run: python3 tools/apply_dimension_generator_v0121_overall_side.py

      - name: Validate DimensionGenerator
        run: python3 tools/validate_ilogic.py DimensionGenerator.vb

      - name: V0.12.1 safety assertions
        run: |
          grep -q 'nodes As List(Of NodeRecord), _' DimensionGenerator.vb
          grep -q 'requests As List(Of AutoChainRequestV01)) As Integer' DimensionGenerator.vb
          grep -q 'placementX = request.OverallPlacementPoint.X' DimensionGenerator.vb
          grep -q 'OVERALL_VERTICAL_FLANGE' DimensionGenerator.vb
          grep -q 'placementSide' DimensionGenerator.vb

      - name: Commit V0.12.1 generator
        run: |
          if git diff --quiet -- DimensionGenerator.vb; then
            echo "No DimensionGenerator change to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DimensionGenerator.vb
          git commit -m 'Keep vertical overall with chosen chain side V0.12.1'
          git push origin main
