name: Apply DimensionGenerator V0.4

on:
  push:
    paths:
      - 'tools/apply_dimension_generator_v04.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch DimensionGenerator
        run: python3 tools/apply_dimension_generator_v04.py
      - name: Validate iLogic source
        run: python3 tools/validate_ilogic.py DimensionGenerator.vb
      - name: Commit V0.4 generator
        run: |
          if git diff --quiet -- DimensionGenerator.vb; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DimensionGenerator.vb
          git commit -m "Enable controlled bisector centerlines and chain dimensions V0.4"
          git push origin HEAD:main
