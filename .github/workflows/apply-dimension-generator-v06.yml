name: Apply DimensionGenerator V0.6

on:
  push:
    paths:
      - 'tools/apply_dimension_generator_v06_safe_axes.py'
      - '.github/workflows/apply-dimension-generator-v06.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch DimensionGenerator
        run: python3 tools/apply_dimension_generator_v06_safe_axes.py

      - name: Validate iLogic source
        run: python3 tools/validate_ilogic.py DimensionGenerator.vb

      - name: Commit V0.6 generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DimensionGenerator.vb
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use safe straight-component axes for fitting centers V0.6"
            git push origin main
          fi
