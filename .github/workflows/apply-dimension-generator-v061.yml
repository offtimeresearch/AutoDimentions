name: Apply DimensionGenerator V0.6.1 Safe

on:
  push:
    paths:
      - 'tools/apply_dimension_generator_v061_external_centerlines.py'
      - '.github/workflows/apply-dimension-generator-v061.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch DimensionGenerator
        run: python3 tools/apply_dimension_generator_v061_external_centerlines.py

      - name: Validate DimensionGenerator
        run: python3 tools/validate_ilogic.py DimensionGenerator.vb

      - name: Validate CenterlineGenerator
        run: python3 tools/validate_ilogic.py CenterlineGenerator.vb

      - name: Commit safe production generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DimensionGenerator.vb
          if git diff --cached --quiet; then
            echo "No DimensionGenerator changes to commit"
          else
            git commit -m "Keep AddBisector out of production generator V0.6.1"
            git push
          fi
