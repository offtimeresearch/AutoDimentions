name: Apply DimensionGenerator V0.6.2

on:
  push:
    paths:
      - 'tools/apply_dimension_generator_v062_existing_centerlines.py'
      - '.github/workflows/apply-dimension-generator-v062.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch DimensionGenerator
        run: python3 tools/apply_dimension_generator_v062_existing_centerlines.py

      - name: Validate iLogic source
        run: python3 tools/validate_ilogic.py DimensionGenerator.vb

      - name: Commit V0.6.2 generator
        run: |
          if git diff --quiet -- DimensionGenerator.vb; then
            echo "No DimensionGenerator change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DimensionGenerator.vb
          git commit -m "Reuse existing centerlines for fitting centers V0.6.2"
          git push origin main
