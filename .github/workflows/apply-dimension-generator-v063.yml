name: Apply DimensionGenerator V0.6.3

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/apply_dimension_generator_v063_centerline_scan.py'
      - '.github/workflows/apply-dimension-generator-v063.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch DimensionGenerator
        run: python3 tools/apply_dimension_generator_v063_centerline_scan.py
      - name: Validate iLogic source
        run: python3 tools/validate_ilogic.py DimensionGenerator.vb
      - name: Commit V0.6.3 generator
        run: |
          if git diff --quiet -- DimensionGenerator.vb; then
            echo 'No DimensionGenerator changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DimensionGenerator.vb
          git commit -m 'Scan existing sheet centerlines directly V0.6.3'
          git push
