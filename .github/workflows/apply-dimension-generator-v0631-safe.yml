name: Apply DimensionGenerator V0.6.3.1 Safe

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_dimension_generator_v0631_safe.py'
      - 'CenterlineDimensionProbe.vb'
      - '.github/workflows/apply-dimension-generator-v0631-safe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch DimensionGenerator
        run: python tools/apply_dimension_generator_v0631_safe.py

      - name: Validate DimensionGenerator
        run: python tools/validate_ilogic.py DimensionGenerator.vb

      - name: Validate CenterlineDimensionProbe
        run: python tools/validate_ilogic.py CenterlineDimensionProbe.vb

      - name: Commit safe production generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DimensionGenerator.vb
          if git diff --cached --quiet; then
            echo "No DimensionGenerator changes to commit"
          else
            git commit -m "Disable centerline consumption in production V0.6.3.1"
            git push
          fi
