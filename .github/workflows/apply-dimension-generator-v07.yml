name: Apply DimensionGenerator V0.7

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/patch_dimension_generator_v07.py'
      - 'CenterlineChainProbe.vb'
      - '.github/workflows/apply-dimension-generator-v07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch DimensionGenerator
        run: python tools/patch_dimension_generator_v07.py

      - name: Validate DimensionGenerator
        run: python tools/validate_ilogic.py DimensionGenerator.vb

      - name: Validate CenterlineChainProbe
        run: python tools/validate_ilogic.py CenterlineChainProbe.vb

      - name: Safety assertions
        run: |
          grep -q 'DIMENSION GENERATOR V0.7' DimensionGenerator.vb
          grep -q 'CENTER_CHAIN SAFE_FALLBACK' DimensionGenerator.vb
          grep -q 'horizontal dimension -> ONE vertical centerline' DimensionGenerator.vb
          grep -q 'vertical dimension -> ONE horizontal centerline' DimensionGenerator.vb
          grep -q 'CENTERLINE_CHAIN_PROBE immediately before ChainDimensionSets.Add' CenterlineChainProbe.vb
          echo 'V0.7 safety assertions passed.'

      - name: Commit V0.7 generator
        run: |
          if git diff --quiet -- DimensionGenerator.vb; then
            echo 'DimensionGenerator.vb already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DimensionGenerator.vb
          git commit -m 'Use single directional centerline datums V0.7'
          git push
