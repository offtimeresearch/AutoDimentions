name: Apply DimensionGenerator V0.8

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/patch_dimension_generator_v08.py'
      - '.github/workflows/apply-dimension-generator-v08.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch DimensionGenerator
        run: python tools/patch_dimension_generator_v08.py

      - name: Validate DimensionGenerator
        run: python tools/validate_ilogic.py DimensionGenerator.vb

      - name: Safety assertions
        run: |
          grep -q 'DimensionGenerator V0.8' DimensionGenerator.vb
          grep -q 'EnsureSafeSpoolCenterlinesV08' DimensionGenerator.vb
          grep -q 'CENTERLINE_INTEGRATED ensured=' DimensionGenerator.vb
          grep -q 'sheet.Centerlines.Add(points)' DimensionGenerator.vb
          python - <<'PY'
          from pathlib import Path
          t = Path('DimensionGenerator.vb').read_text(encoding='utf-8')
          s = t.index('Function EnsureSafeSpoolCenterlinesV08')
          e = t.index('Function ResolveProjectedAnchorsV03', s)
          block = t[s:e]
          assert 'AddBisector' not in block, 'integrated centerline block must not use AddBisector'
          assert 'REGULAR_PORT_POINTS' in block, 'proven regular centerline method missing'
          print('V0.8 integrated-centerline safety assertions passed.')
          PY

      - name: Commit V0.8 generator
        run: |
          if git diff --quiet -- DimensionGenerator.vb; then
            echo 'DimensionGenerator.vb already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DimensionGenerator.vb
          git commit -m 'Integrate safe pipe and flange centerlines V0.8'
          git push
