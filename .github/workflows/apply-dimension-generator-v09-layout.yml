name: Apply DimensionGenerator V0.9 Layout

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/patch_dimension_generator_v09_layout.py'
      - '.github/workflows/apply-dimension-generator-v09-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch DimensionGenerator
        run: python tools/patch_dimension_generator_v09_layout.py

      - name: Validate DimensionGenerator
        run: python tools/validate_ilogic.py DimensionGenerator.vb

      - name: V0.9 safety assertions
        run: |
          grep -q 'DimensionGenerator V0.9' DimensionGenerator.vb
          grep -q 'CHAIN_NATIVE' DimensionGenerator.vb
          grep -q 'AutoReferenceSegmentV09' DimensionGenerator.vb
          grep -q 'TEE_' DimensionGenerator.vb
          grep -q 'ELBOW_' DimensionGenerator.vb
          grep -q 'REDUCER_' DimensionGenerator.vb
          grep -q 'OVERALL_VERTICAL_FLANGE' DimensionGenerator.vb
          python - <<'PY'
          from pathlib import Path
          t = Path('DimensionGenerator.vb').read_text(encoding='utf-8')
          # Centerline-dependent intervals stay outside ChainDimensionSets.Add.
          s = t.index('Function CreateChainDimensionsV01')
          e = t.index('Function CreateIndividualChainFallbackV02', s)
          block = t[s:e]
          assert 'a.Intent IsNot Nothing AndAlso b.Intent IsNot Nothing' in block
          assert 'CreateIntervalDimensionV09' in block
          print('V0.9 chain/reference safety assertions passed.')
          PY

      - name: Commit V0.9 generator
        run: |
          if git diff --quiet -- DimensionGenerator.vb; then
            echo 'DimensionGenerator.vb already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DimensionGenerator.vb
          git commit -m 'Improve chain layout and reference fitting dimensions V0.9'
          git push
