name: Apply Elbow Label V0.6

on:
  push:
    paths:
      - 'tools/patch_elbow_label_v06.py'
      - '.github/workflows/apply-elbow-label-v06.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply elbow label patch
        run: python3 tools/patch_elbow_label_v06.py

      - name: Validate iLogic / VB source
        run: python3 tools/validate_ilogic.py TopologyExtractor.vb

      - name: Commit updated source
        shell: bash
        run: |
          set -e
          if git diff --quiet -- TopologyExtractor.vb; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TopologyExtractor.vb
          git commit -m "Place elbow label near drawn arc V0.6"
          git push origin HEAD:main
