name: Build DimensionGenerator V0.1

on:
  push:
    paths:
      - 'tools/build_dimension_generator_v01.py'
      - 'TopologyExtractor.vb'
      - '.github/workflows/build-dimension-generator-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build drawing dimension generator
        run: python tools/build_dimension_generator_v01.py

      - name: Validate iLogic source
        run: python tools/validate_ilogic.py DimensionGenerator.vb

      - name: Commit generated DimensionGenerator
        run: |
          if git diff --quiet -- DimensionGenerator.vb && git ls-files --error-unmatch DimensionGenerator.vb >/dev/null 2>&1; then
            echo "DimensionGenerator.vb already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DimensionGenerator.vb
          git commit -m "Build pure drawing DimensionGenerator V0.1"
          git push
