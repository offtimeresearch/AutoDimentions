name: Finalize AutoSpool V0.4

on:
  workflow_dispatch:
  push:
    paths:
      - '.autospool_trigger'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct latest iLogic file
        shell: bash
        run: |
          set -euo pipefail
          cat .autospool_stage/code.b64.part1 .autospool_stage/code.b64.part2 | base64 -d | gunzip > "Topology Extractor.iLogicVb"
          echo "lines=$(wc -l < 'Topology Extractor.iLogicVb') bytes=$(wc -c < 'Topology Extractor.iLogicVb')"
          grep -q "AUTOSPOOL - SINGLE SPOOL TOPOLOGY / DIMENSION VERIFIER V0.4" "Topology Extractor.iLogicVb"
      - name: Remove temporary staging files
        shell: bash
        run: |
          rm -rf .autospool_stage .autospool_parts
          rm -f .autospool_trigger .chatgpt-write-test
          rm -f .github/workflows/assemble-autospool-v04.yml .github/workflows/finalize-v04.yml
      - name: Commit final V0.4
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Topology Extractor to AutoSpool V0.4"
          git push origin HEAD:main
