name: Normalize iLogic Source

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/normalize_ilogic.py'
      - '.github/workflows/normalize-ilogic.yml'
      - '.normalize_ilogic_trigger'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize source for Inventor iLogic
        run: python3 tools/normalize_ilogic.py "Topology Extractor.iLogicVb"

      - name: Verify BOM is gone
        shell: python
        run: |
          from pathlib import Path
          p = Path('Topology Extractor.iLogicVb')
          raw = p.read_bytes()
          assert not raw.startswith(b'\xef\xbb\xbf'), 'UTF-8 BOM is still present'
          assert raw.startswith(b'AddReference "System.Windows.Forms.dll"'), 'Invalid iLogic header start'
          print('iLogic header OK')

      - name: Commit normalized source if changed
        shell: bash
        run: |
          set -e
          rm -f .normalize_ilogic_trigger
          if git diff --quiet && git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Topology Extractor for Inventor iLogic"
          git push origin HEAD:main
