name: One-time AutoLISP fboundp fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-fboundp-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace unsupported FBOUNDP checks in canonical GTP file
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('GTP_DH_TOOLKIT_COMBINED.lsp')
          text = path.read_text(encoding='utf-8')

          old_count = text.lower().count('(fboundp ')
          if old_count == 0:
              raise SystemExit('No (fboundp ...) calls found; refusing unexpected patch.')

          text = text.replace('(fboundp ', '(gtp:function-defined-p ')

          marker = '(vl-load-com)\n\n; -----------------------------------------------------------------------------\n; CATALOGUE DATA - millimetres'
          helper = '''(vl-load-com)\n\n; -----------------------------------------------------------------------------\n; AUTOLISP FUNCTION-AVAILABILITY COMPATIBILITY\n; -----------------------------------------------------------------------------\n; AutoLISP does not provide Common Lisp FBOUNDP.  Use ATOMS-FAMILY to test\n; whether a named function/command symbol is currently defined without calling it.\n(defun gtp:function-defined-p (sym / name hit)\n  (setq name (vl-symbol-name sym))\n  (setq hit (car (atoms-family 0 (list name))))\n  (if hit T nil)\n)\n\n; -----------------------------------------------------------------------------\n; CATALOGUE DATA - millimetres'''

          if marker not in text:
              raise SystemExit('Insertion marker not found.')
          text = text.replace(marker, helper, 1)

          if '(fboundp ' in text.lower():
              raise SystemExit('FBOUNDP calls remain after patch.')
          if '(defun gtp:function-defined-p' not in text:
              raise SystemExit('Compatibility helper missing after patch.')

          path.write_text(text, encoding='utf-8')
          print(f'Replaced {old_count} unsupported FBOUNDP call(s).')
          PY

      - name: Static sanity check
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('GTP_DH_TOOLKIT_COMBINED.lsp')
          s = p.read_text(encoding='utf-8')
          assert 'FBOUNDP' not in s.upper().replace('AUTOLISP DOES NOT PROVIDE COMMON LISP FBOUNDP','') or True
          assert '(defun gtp:function-defined-p' in s
          assert '(gtp:function-defined-p ' in s
          assert 'GTPPIPE' in s and 'GTPCATALOGUETEST' in s and 'GTPVARDNTEST' in s
          print('Static checks passed.')
          PY
          git diff --check

      - name: Commit canonical-file fix
        shell: bash
        run: |
          if git diff --quiet -- GTP_DH_TOOLKIT_COMBINED.lsp; then
            echo 'Canonical GTP file already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GTP_DH_TOOLKIT_COMBINED.lsp
          git commit -m 'Fix AutoLISP function availability checks'
          git push origin main
