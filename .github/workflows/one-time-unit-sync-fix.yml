name: One-time AutoLISP unit sync fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-unit-sync-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make standalone component commands refresh drawing units
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('GTP_DH_TOOLKIT_COMBINED.lsp')
          text = path.read_text(encoding='utf-8')
          commands = ['GTPVALVE','GTPTEE','GTPREDUCER','GTPBRANCH','GTPENDCAP']
          total = 0

          for cmd in commands:
              pat = re.compile(
                  rf'(\(defun c:{cmd}\b.*?\(setq old \(getvar "CMDECHO"\)\)\s*\n\s*\(setvar "CMDECHO" 0\))(?!\s*\n\s*\(gtp:setup-units\))',
                  re.S
              )
              text, n = pat.subn(r'\1\n  (gtp:setup-units)', text)
              total += n
              print(f'{cmd}: patched {n} definition(s)')

          if total == 0:
              raise SystemExit('No standalone component command definitions were patched.')

          # Every active/duplicate standalone component command in the combined file must
          # refresh units before it starts creating geometry.
          for cmd in commands:
              defs = list(re.finditer(rf'\(defun c:{cmd}\b', text))
              if not defs:
                  raise SystemExit(f'Missing command definition: {cmd}')
              for i, m in enumerate(defs):
                  end = defs[i+1].start() if i+1 < len(defs) else min(len(text), m.start()+9000)
                  block = text[m.start():end]
                  marker = block.find('(setvar "CMDECHO" 0)')
                  if marker < 0:
                      continue
                  nearby = block[marker:marker+250]
                  if '(gtp:setup-units)' not in nearby:
                      raise SystemExit(f'{cmd} definition still lacks unit setup near CMDECHO.')

          path.write_text(text, encoding='utf-8')
          print(f'Patched {total} standalone component command definition(s).')
          PY

      - name: Static sanity check
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('GTP_DH_TOOLKIT_COMBINED.lsp').read_text(encoding='utf-8')
          assert '(defun gtp:setup-units' in s
          assert '((= u 6)  (list "metres" 0.001))' in s
          assert 'GTPVALVE' in s and 'GTPPIPE' in s
          print('Unit sync static checks passed.')
          PY
          git diff --check

      - name: Commit canonical-file fix
        shell: bash
        run: |
          if git diff --quiet -- GTP_DH_TOOLKIT_COMBINED.lsp; then
            echo 'Canonical GTP file already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GTP_DH_TOOLKIT_COMBINED.lsp
          git commit -m 'Fix standalone component drawing-unit detection'
          git push origin main
