name: Validate iLogic Source

on:
  workflow_dispatch:
  push:
    paths:
      - 'TopologyExtractor.vb'
      - 'tools/validate_ilogic.py'
      - '.github/workflows/validate-ilogic.yml'
  pull_request:
    paths:
      - 'TopologyExtractor.vb'
      - 'tools/validate_ilogic.py'
      - '.github/workflows/validate-ilogic.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static-check iLogic / VB source
        run: python3 tools/validate_ilogic.py "TopologyExtractor.vb"
